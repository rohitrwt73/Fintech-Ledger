services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_6fPekD3Zdygp
    ports: ["5432:5432"]
    volumes: ["ledger-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d fintech_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: .
    env_file: .env
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  ledger-data:
