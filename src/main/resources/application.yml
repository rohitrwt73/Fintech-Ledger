server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
spring:
  application.name: fintech-ledger
  datasource:
    url: ${DB_URL:jdbc:postgresql://host/database?sslmode=require}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:dbpass}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management.endpoints.web.exposure.include: health,info
app:
  jwt-secret: ${JWT_SECRET:your_jwtToken}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
  risk-transfer-threshold: ${RISK_TRANSFER_THRESHOLD:100000.00}
springdoc.swagger-ui.path: /swagger-ui.html
